<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Website Enquiry</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:20px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:6px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
            <tr>
              <td style="background-color:#0b0b0b; padding:20px 30px;">
                <span style="color:#e0c214; font-size:20px; font-weight:bold;">SSB with ISV</span>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 30px 8px 30px;">
                <h2 style="margin:0 0 4px 0; font-size:20px; color:#1a1a1a;">New Website Enquiry</h2>
                <p style="margin:0; font-size:13px; color:#888888;">Subject: {{subject}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 30px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                  <tr>
                    <td style="padding:8px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#555555; width:170px;"><strong>First Name</strong></td>
                    <td style="padding:8px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#333333;">{{first_name}}</td>
                  </tr>
                  <tr>
                    <td style="padding:8px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#555555;"><strong>Last Name</strong></td>
                    <td style="padding:8px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#333333;">{{last_name}}</td>
                  </tr>
                  <tr>
                    <td style="padding:8px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#555555;"><strong>Mobile Number</strong></td>
                    <td style="padding:8px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#333333;">{{phone}}</td>
                  </tr>
                  <tr>
                    <td style="padding:8px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#555555;"><strong>Email Address</strong></td>
                    <td style="padding:8px 0; border-bottom:1px solid #eeeeee; font-size:14px; color:#333333;">{{email}}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 30px 24px 30px;">
                <p style="margin:0 0 6px 0; font-size:14px; color:#555555;"><strong>Message</strong></p>
                <div style="background-color:#f9f9f9; border-left:3px solid #e0c214; padding:12px 16px; font-size:14px; color:#333333; line-height:1.6; white-space:pre-wrap;">{{message}}</div>
              </td>
            </tr>
            <tr>
              <td style="background-color:#f4f4f4; padding:16px 30px; text-align:center; font-size:12px; color:#999999;">
                SSB with ISV — New Website Enquiry Notification
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
